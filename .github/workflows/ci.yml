name: CI

on:
  push: {}
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Swift 6 on macOS 14
        if: matrix.os == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Record runtime and compiler
        run: |
          sw_vers
          uname -m
          swift --version
      - name: Test native behavior
        env:
          PASSPORT_TEST_OUTPUT: .build/verification
        run: scripts/test.sh
      - name: Build and verify universal app
        run: scripts/build-app.sh
      - name: Exercise native window and file dialogs
        env:
          PASSPORT_SMOKE_OUTPUT: .build/smoke-output
        run: scripts/smoke-test.sh
      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-verification-${{ matrix.os }}
          path: |
            .build/verification/
            .build/smoke-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Test Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=app
          --cov=constants
          --cov=main
          --cov=pdf_processing
          --cov=utils
          --cov=watermark
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
